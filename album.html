<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album | MIDNIGHT FM</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0b0b0c;
      color: #fff;
      font-family: "Inter", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top left, #c6a97210, transparent 25%),
        radial-gradient(circle at top right, #8b5e3c10, transparent 25%),
        #0b0b0c;
      z-index: -1;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(10, 10, 10, .93);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid #1e2226;
    }

    .topbar-inner {
      max-width: 1080px;
      min-height: 64px;
      margin: auto;
      padding: 9px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo,
    .back-btn {
      text-decoration: none;
      font-weight: 800;
    }

    .logo {
      font-size: 31px;
      font-weight: 900;
      background: linear-gradient(to right, #d6b27b, #8e623f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .back-btn {
      color: #d6b27b;
      font-size: 13px;
    }

    .container {
      max-width: 1080px;
      margin: auto;
      padding: 26px 18px 46px;
    }

    .loading,
    .muted {
      color: #9ca3af;
      font-size: 14px;
    }

    .error {
      padding: 20px;
      color: #d6b27b;
      border: 1px solid #28282b;
      border-radius: 8px;
      background: #111114;
    }

    .error a {
      display: inline-block;
      margin-top: 14px;
      color: #d6b27b;
    }

    .album-header {
      display: grid;
      grid-template-columns: 290px 1fr;
      gap: 30px;
      align-items: start;
      margin-bottom: 35px;
    }

    .cover {
      width: 290px;
      aspect-ratio: 1;
      display: block;
      object-fit: cover;
      border-radius: 9px;
      border: 1px solid rgba(212, 175, 55, .18);
      background: #111114;
      box-shadow: 0 0 50px rgba(212, 175, 55, .07);
    }

    .kicker {
      margin-bottom: 10px;
      color: #c9a46a;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .album-title {
      margin-bottom: 10px;
      font-size: clamp(36px, 5.5vw, 62px);
      font-weight: 900;
      line-height: .98;
    }

    .artist-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #e8e8ea;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
    }

    .artist-link:hover {
      color: #d6b27b;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-card,
    .panel {
      background: #111114;
      border: 1px solid #232323;
      border-radius: 7px;
    }

    .stat-card {
      padding: 14px;
    }

    .stat-card h3 {
      margin-bottom: 7px;
      color: #9ca3af;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .stat-card p {
      color: #e8e8ea;
      font-size: 19px;
      font-weight: 800;
    }

    .section {
      margin-top: 28px;
    }

    .section-title {
      padding-bottom: 10px;
      margin-bottom: 15px;
      color: #e4e4e7;
      border-bottom: 1px solid #22252b;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .rating-panel {
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    .stars {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .star-button {
      width: 43px;
      height: 43px;
      border: 1px solid #2d2d31;
      border-radius: 7px;
      background: #151519;
      color: #9ca3af;
      cursor: pointer;
      font-size: 20px;
      transition: .2s;
    }

    .star-button.active,
    .star-button:hover {
      border-color: #d6b27b;
      color: #d6b27b;
      background: #1d1a15;
    }

    .rating-form {
      display: grid;
      gap: 10px;
    }

    .rating-form textarea {
      width: 100%;
      min-height: 94px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #28282b;
      border-radius: 7px;
      outline: none;
      background: #0d0d10;
      color: #fff;
      font: inherit;
    }

    .rating-form textarea:focus {
      border-color: #c6a972;
    }

    .save-btn {
      justify-self: start;
      border: none;
      border-radius: 7px;
      padding: 11px 17px;
      background: linear-gradient(to right, #d6b27b, #8e623f);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 900;
    }

    .save-btn:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      min-height: 20px;
      color: #9ca3af;
      font-size: 13px;
    }

    .message.success {
      color: #d6b27b;
    }

    .track-list,
    .review-list {
      display: grid;
      gap: 9px;
    }

    .track,
    .review {
      padding: 13px 15px;
      background: #111114;
      border: 1px solid #232323;
      border-radius: 7px;
    }

    .track {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      color: #e8e8ea;
      font-size: 14px;
    }

    .track span:first-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .review-header {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 8px;
      color: #d6b27b;
      font-size: 14px;
      font-weight: 800;
    }

    .review p {
      color: #d4d4d8;
      font-size: 14px;
      line-height: 1.55;
    }

    @media (max-width: 720px) {
      .topbar-inner {
        padding: 11px 14px;
      }

      .logo {
        font-size: 26px;
      }

      .container {
        padding: 18px 14px 36px;
      }

      .album-header {
        display: block;
      }

      .cover {
        width: min(290px, 100%);
        margin-bottom: 20px;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="index.html">MIDNIGHT FM</a>
      <a class="back-btn" href="index.html">&larr; Voltar</a>
    </div>
  </header>

  <main class="container" id="app">
    <p class="loading">Carregando album...</p>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      getDocs,
      serverTimestamp,
      setDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD8jI-hfEBI9f6o9CFtBX0TudtPjzGvKLQ",
      authDomain: "music-explorer-caeaa.firebaseapp.com",
      projectId: "music-explorer-caeaa",
      storageBucket: "music-explorer-caeaa.firebasestorage.app",
      messagingSenderId: "22348266636",
      appId: "1:22348266636:web:6c31922207796b78d4cfa9"
    };

    const LASTFM_API_KEY = "f45f6d345baa8f3c76bb337221cd2402";
    const appRoot = document.getElementById("app");
    const params = new URLSearchParams(window.location.search);
    const artistName = params.get("artist")?.trim();
    const albumName = params.get("album")?.trim();
    const firebaseApp = initializeApp(firebaseConfig);
    const db = getFirestore(firebaseApp);

    const placeholderSvg = encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="600" height="600">
        <rect width="600" height="600" fill="#141416"/>
        <circle cx="300" cy="260" r="104" fill="none" stroke="#c9a46a" stroke-width="7" opacity=".7"/>
        <circle cx="300" cy="260" r="22" fill="#c9a46a" opacity=".7"/>
        <text x="300" y="410" text-anchor="middle" fill="#c9a46a"
          font-family="Arial" font-size="26" font-weight="700">MIDNIGHT FM</text>
      </svg>
    `);
    const PLACEHOLDER_IMAGE = `data:image/svg+xml;charset=utf-8,${placeholderSvg}`;

    let currentRating = 0;
    let albumPayload = null;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function numberText(value) {
      return Number(value || 0).toLocaleString("pt-BR");
    }

    function stableId(value) {
      return String(value)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 120);
    }

    function visitorId() {
      const key = "midnightFmVisitorId";
      const existing = localStorage.getItem(key);

      if (existing) {
        return existing;
      }

      const created = crypto.randomUUID
        ? crypto.randomUUID()
        : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      localStorage.setItem(key, created);
      return created;
    }

    function starsText(value) {
      const rating = Math.max(0, Math.min(5, Number(value) || 0));
      return "★".repeat(rating) + "☆".repeat(5 - rating);
    }

    async function lastFmAlbumInfo() {
      const queryParams = new URLSearchParams({
        method: "album.getinfo",
        artist: artistName,
        album: albumName,
        api_key: LASTFM_API_KEY,
        format: "json",
        autocorrect: "1"
      });

      const response = await fetch(`https://ws.audioscrobbler.com/2.0/?${queryParams}`);

      if (!response.ok) {
        throw new Error(`Falha ao acessar o Last.fm: ${response.status}`);
      }

      const data = await response.json();

      if (data.error) {
        throw new Error(data.message || "Album nao encontrado.");
      }

      return data.album;
    }

    async function loadRatings() {
      const snapshot = await getDocs(collection(db, "ratings"));
      const ratings = [];

      snapshot.forEach((item) => {
        const data = item.data();
        const rating = Number(data.rating);

        if (
          Number.isFinite(rating) &&
          data.artist === albumPayload.artist &&
          data.name === albumPayload.name
        ) {
          ratings.push(data);
        }
      });

      renderRatings(ratings);
    }

    function renderRatings(ratings) {
      const count = ratings.length;
      const average = count
        ? ratings.reduce((total, item) => total + Number(item.rating || 0), 0) / count
        : 0;

      document.getElementById("ratingAverage").textContent = count
        ? average.toFixed(1)
        : "0.0";
      document.getElementById("ratingCount").textContent = `${count} avaliacoes`;

      const reviews = ratings
        .filter((item) => item.comment)
        .slice(0, 8);
      const reviewList = document.getElementById("reviews");

      if (!reviews.length) {
        reviewList.innerHTML = `<p class="muted">Nenhum comentario ainda.</p>`;
        return;
      }

      reviewList.innerHTML = reviews.map((item) => `
        <article class="review">
          <div class="review-header">
            <span>${escapeHtml(item.userName || "Visitante")}</span>
            <span>${starsText(item.rating)}</span>
          </div>
          <p>${escapeHtml(item.comment)}</p>
        </article>
      `).join("");
    }

    function setMessage(message, success = false) {
      const element = document.getElementById("ratingMessage");
      element.textContent = message;
      element.classList.toggle("success", success);
    }

    function selectRating(value) {
      currentRating = value;
      document.querySelectorAll(".star-button").forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.rating) <= value);
      });
    }

    async function saveRating(event) {
      event.preventDefault();

      if (!currentRating) {
        setMessage("Escolha uma nota antes de salvar.");
        return;
      }

      const button = document.getElementById("saveRatingButton");
      const comment = document.getElementById("ratingComment").value.trim();
      const user = visitorId();
      const documentId = `${stableId(albumPayload.artist)}-${stableId(albumPayload.name)}-${user}`;

      button.disabled = true;
      setMessage("Salvando...");

      try {
        await setDoc(doc(db, "ratings", documentId), {
          artist: albumPayload.artist,
          name: albumPayload.name,
          rating: currentRating,
          comment,
          userId: user,
          userName: "Visitante",
          updatedAt: serverTimestamp()
        }, { merge: true });

        setMessage("Avaliacao salva.", true);
        await loadRatings();
      } catch (error) {
        console.error("Erro ao salvar avaliacao:", error);
        setMessage("O Firebase recusou a avaliacao. Confira as regras do Firestore.");
      } finally {
        button.disabled = false;
      }
    }

    function renderAlbum(album) {
      const tracks = Array.isArray(album.tracks?.track)
        ? album.tracks.track
        : [];
      const cover = album.image?.find((item) => item.size === "extralarge")?.["#text"] ||
        album.image?.at(-1)?.["#text"] ||
        PLACEHOLDER_IMAGE;
      const artist = album.artist || artistName;
      const title = album.name || albumName;

      albumPayload = { artist, name: title };
      document.title = `${title} | MIDNIGHT FM`;

      appRoot.innerHTML = `
        <section class="album-header">
          <img
            class="cover"
            src="${escapeHtml(cover || PLACEHOLDER_IMAGE)}"
            alt="Capa de ${escapeHtml(title)}"
            onerror="this.onerror=null; this.src='${PLACEHOLDER_IMAGE}'"
          >

          <div>
            <p class="kicker">Album</p>
            <h1 class="album-title">${escapeHtml(title)}</h1>
            <a class="artist-link" href="artista.html?artist=${encodeURIComponent(artist)}">
              ${escapeHtml(artist)}
            </a>

            <div class="stats">
              <div class="stat-card">
                <h3>Ouvintes</h3>
                <p>${numberText(album.listeners)}</p>
              </div>
              <div class="stat-card">
                <h3>Reproducoes</h3>
                <p>${numberText(album.playcount)}</p>
              </div>
              <div class="stat-card">
                <h3>Nota do site</h3>
                <p><span id="ratingAverage">0.0</span></p>
                <small class="muted" id="ratingCount">0 avaliacoes</small>
              </div>
            </div>

            <section class="panel rating-panel">
              <h2 class="section-title">Sua avaliacao</h2>
              <form class="rating-form" id="ratingForm">
                <div class="stars" aria-label="Nota de 1 a 5">
                  ${[1, 2, 3, 4, 5].map((value) => `
                    <button class="star-button" type="button" data-rating="${value}" aria-label="${value} estrela">
                      ★
                    </button>
                  `).join("")}
                </div>
                <textarea id="ratingComment" maxlength="600" placeholder="Comentario opcional"></textarea>
                <button class="save-btn" id="saveRatingButton" type="submit">Salvar avaliacao</button>
                <p class="message" id="ratingMessage"></p>
              </form>
            </section>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">Faixas</h2>
          <div class="track-list">
            ${tracks.length ? tracks.map((track, index) => `
              <article class="track">
                <span>${index + 1}. ${escapeHtml(track.name)}</span>
                <span class="muted">${numberText(track.playcount)} plays</span>
              </article>
            `).join("") : '<p class="muted">Nenhuma faixa encontrada.</p>'}
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">Comentarios</h2>
          <div class="review-list" id="reviews">
            <p class="muted">Carregando comentarios...</p>
          </div>
        </section>
      `;

      document.querySelectorAll(".star-button").forEach((button) => {
        button.addEventListener("click", () => selectRating(Number(button.dataset.rating)));
      });
      document.getElementById("ratingForm").addEventListener("submit", saveRating);
    }

    function renderError(message) {
      appRoot.innerHTML = `
        <div class="error">
          ${escapeHtml(message)}
          <br>
          <a href="index.html">&larr; Voltar para a busca</a>
        </div>
      `;
    }

    async function loadAlbum() {
      if (!artistName || !albumName) {
        renderError("Album ou artista nao informado.");
        return;
      }

      try {
        const album = await lastFmAlbumInfo();
        renderAlbum(album);
      } catch (error) {
        console.error("Erro ao carregar album:", error);
        renderError(error.message || "Erro ao carregar album.");
        return;
      }

      try {
        await loadRatings();
      } catch (error) {
        console.error("Erro ao carregar avaliacoes:", error);
        renderRatings([]);
        setMessage("Nao foi possivel carregar as avaliacoes do Firebase.");
      }
    }

    loadAlbum();
  </script>
</body>
</html>
