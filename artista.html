<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artista | MIDNIGHT FM</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0b0b0c;
      color: #fff;
      font-family: "Inter", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top left, #c6a97210, transparent 25%),
        radial-gradient(circle at top right, #8b5e3c10, transparent 25%),
        #0b0b0c;
      z-index: -1;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(10, 10, 10, .93);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid #1e2226;
    }

    .topbar-inner {
      max-width: 1080px;
      min-height: 64px;
      margin: auto;
      padding: 9px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      text-decoration: none;
      font-size: 31px;
      font-weight: 900;
      background: linear-gradient(to right, #d6b27b, #8e623f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .back-btn {
      color: #d6b27b;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: opacity .25s;
    }

    .back-btn:hover {
      opacity: .78;
    }

    .container {
      max-width: 1080px;
      margin: auto;
      padding: 26px 18px 46px;
    }

    .loading,
    .error {
      margin-top: 26px;
      color: #9ca3af;
      font-size: 14px;
    }

    .error {
      padding: 20px;
      color: #d6b27b;
      border: 1px solid #28282b;
      border-radius: 8px;
      background: #111114;
    }

    .error a {
      display: inline-block;
      margin-top: 14px;
      color: #d6b27b;
    }

    .artist-header {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 30px;
      align-items: start;
      margin-bottom: 37px;
    }

    .artist-image {
      width: 260px;
      height: 260px;
      display: block;
      object-fit: cover;
      border-radius: 9px;
      border: 1px solid rgba(212, 175, 55, .18);
      background: #111114;
      box-shadow: 0 0 50px rgba(212, 175, 55, .07);
    }

    .artist-name {
      margin: 4px 0 10px;
      font-size: clamp(37px, 5.5vw, 58px);
      font-weight: 900;
      line-height: .98;
    }

    .listeners {
      margin-bottom: 22px;
      color: #9ca3af;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-card {
      padding: 14px;
      background: #111114;
      border: 1px solid #232323;
      border-radius: 7px;
    }

    .stat-card h3 {
      margin-bottom: 7px;
      color: #9ca3af;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .stat-card p {
      color: #e8e8ea;
      font-size: 19px;
      font-weight: 800;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tag {
      padding: 6px 10px;
      color: #d4d4d8;
      font-size: 11px;
      background: #151519;
      border: 1px solid #272727;
      border-radius: 999px;
    }

    .section {
      margin-top: 36px;
    }

    .section-title {
      padding-bottom: 10px;
      margin-bottom: 15px;
      color: #e4e4e7;
      border-bottom: 1px solid #22252b;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .bio {
      padding: 18px 20px;
      background: #111114;
      border: 1px solid #232323;
      border-radius: 7px;
      color: #d4d4d8;
      font-size: 14px;
      line-height: 1.75;
    }

    .albums-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
      gap: 13px;
    }

    .album-card {
      color: #fff;
      text-decoration: none;
      background: #111114;
      border: 1px solid #232323;
      border-radius: 7px;
      overflow: hidden;
      transition: transform .25s, border-color .25s;
    }

    .album-card:hover {
      transform: translateY(-4px);
      border-color: #c6a972;
    }

    .album-card img {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: #181818;
    }

    .album-info {
      padding: 9px 10px 11px;
    }

    .album-info h3 {
      margin-bottom: 5px;
      font-size: 13px;
      line-height: 1.3;
    }

    .album-info p {
      color: #9ca3af;
      font-size: 11px;
    }

    @media (max-width: 700px) {
      .topbar-inner {
        padding: 11px 14px;
      }

      .logo {
        font-size: 26px;
      }

      .container {
        padding: 18px 14px 36px;
      }

      .artist-header {
        display: block;
      }

      .artist-image {
        width: min(260px, 100%);
        height: auto;
        aspect-ratio: 1;
        margin-bottom: 20px;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="index.html">MIDNIGHT FM</a>
      <a class="back-btn" href="index.html">&larr; Voltar</a>
    </div>
  </header>

  <main class="container" id="app">
    <p class="loading">Carregando artista...</p>
  </main>

  <script type="module">
    const LASTFM_API_KEY = "f45f6d345baa8f3c76bb337221cd2402";
    const artistName = new URLSearchParams(window.location.search).get("artist")?.trim();
    const app = document.getElementById("app");

    const placeholderSvg = encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="600" height="600">
        <rect width="600" height="600" fill="#141416"/>
        <circle cx="300" cy="255" r="88" fill="#28262a"/>
        <path d="M138 520c18-102 306-102 324 0" fill="#28262a"/>
        <text x="300" y="575" text-anchor="middle" fill="#c9a46a"
          font-family="Arial" font-size="22" font-weight="700">MIDNIGHT FM</text>
      </svg>
    `);

    const PLACEHOLDER_IMAGE = `data:image/svg+xml;charset=utf-8,${placeholderSvg}`;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function numberText(value) {
      return Number(value || 0).toLocaleString("pt-BR");
    }

    async function lastFmRequest(method) {
      const params = new URLSearchParams({
        method,
        artist: artistName,
        api_key: LASTFM_API_KEY,
        format: "json",
        autocorrect: "1",
        limit: "18"
      });

      const response = await fetch(
        `https://ws.audioscrobbler.com/2.0/?${params.toString()}`
      );

      if (!response.ok) {
        throw new Error(`Falha ao acessar o Last.fm: ${response.status}`);
      }

      const data = await response.json();

      if (data.error) {
        throw new Error(data.message || "Artista nao encontrado.");
      }

      return data;
    }

    async function getWikipediaSummary(name) {
      try {
        const searchParams = new URLSearchParams({
          action: "query",
          list: "search",
          srsearch: `${name} artista musical cantora cantor`,
          format: "json",
          origin: "*",
          srlimit: "5"
        });

        const response = await fetch(
          `https://pt.wikipedia.org/w/api.php?${searchParams.toString()}`
        );

        if (!response.ok) {
          return null;
        }

        const data = await response.json();
        const result = (data.query?.search || []).find((item) => {
          const title = item.title.toLowerCase();

          return (
            !title.includes("album") &&
            !title.includes("álbum") &&
            !title.includes("discografia") &&
            !title.includes("canção")
          );
        });

        if (!result) {
          return null;
        }

        const summaryResponse = await fetch(
          `https://pt.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(result.title)}`
        );

        if (!summaryResponse.ok) {
          return null;
        }

        return summaryResponse.json();
      } catch (error) {
        return null;
      }
    }

    function renderError(message) {
      app.innerHTML = `
        <div class="error">
          ${escapeHtml(message)}
          <br>
          <a href="index.html">&larr; Voltar para a busca</a>
        </div>
      `;
    }

    async function loadArtist() {
      if (!artistName) {
        renderError("Nenhum artista foi selecionado.");
        return;
      }

      try {
        const [infoData, albumsData, wikipedia] = await Promise.all([
          lastFmRequest("artist.getinfo"),
          lastFmRequest("artist.gettopalbums"),
          getWikipediaSummary(artistName)
        ]);

        const info = infoData.artist;

        if (!info) {
          throw new Error("Artista nao encontrado.");
        }

        const albums = (albumsData.topalbums?.album || [])
          .filter((album) => album.name && album.name !== "(null)")
          .slice(0, 18);

        const displayName = info.name || artistName;
        const image = wikipedia?.originalimage?.source ||
          wikipedia?.thumbnail?.source ||
          PLACEHOLDER_IMAGE;
        const bio = wikipedia?.extract ||
          info.bio?.summary?.replace(/<a[\s\S]*$/i, "").trim() ||
          "Sem descricao disponivel.";

        const tagsHtml = (info.tags?.tag || [])
          .slice(0, 6)
          .map((tag) => `<span class="tag">${escapeHtml(tag.name)}</span>`)
          .join("");

        const albumsHtml = albums.map((album) => {
          const cover = album.image?.[3]?.["#text"] || PLACEHOLDER_IMAGE;

          return `
            <a
              class="album-card"
              href="album.html?artist=${encodeURIComponent(displayName)}&album=${encodeURIComponent(album.name)}"
            >
              <img
                src="${escapeHtml(cover)}"
                alt="Capa de ${escapeHtml(album.name)}"
                onerror="this.onerror=null; this.src='${PLACEHOLDER_IMAGE}'"
              >
              <div class="album-info">
                <h3>${escapeHtml(album.name)}</h3>
                <p>${numberText(album.playcount)} reproducoes</p>
              </div>
            </a>
          `;
        }).join("");

        document.title = `${displayName} | MIDNIGHT FM`;

        app.innerHTML = `
          <section class="artist-header">
            <img
              class="artist-image"
              src="${escapeHtml(image)}"
              alt="Foto de ${escapeHtml(displayName)}"
              onerror="this.onerror=null; this.src='${PLACEHOLDER_IMAGE}'"
            >

            <div class="artist-info">
              <h1 class="artist-name">${escapeHtml(displayName)}</h1>
              <p class="listeners">${numberText(info.stats?.listeners)} ouvintes no Last.fm</p>

              <div class="stats">
                <div class="stat-card">
                  <h3>Reproducoes</h3>
                  <p>${numberText(info.stats?.playcount)}</p>
                </div>
                <div class="stat-card">
                  <h3>Ouvintes</h3>
                  <p>${numberText(info.stats?.listeners)}</p>
                </div>
                <div class="stat-card">
                  <h3>Albuns populares</h3>
                  <p>${albums.length}</p>
                </div>
              </div>

              <div class="tags">${tagsHtml}</div>
            </div>
          </section>

          <section class="section">
            <h2 class="section-title">Sobre</h2>
            <div class="bio">${escapeHtml(bio)}</div>
          </section>

          <section class="section">
            <h2 class="section-title">Albuns populares</h2>
            <div class="albums-grid">
              ${albumsHtml || '<p class="loading">Nenhum album encontrado.</p>'}
            </div>
          </section>
        `;
      } catch (error) {
        console.error("Erro ao carregar artista:", error);
        renderError(error.message || "Erro ao carregar artista.");
      }
    }

    loadArtist();
  </script>
</body>
</html>
